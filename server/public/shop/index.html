<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>IPDokan Shop</title>
<meta name="theme-color" content="#06051a" />
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #06051a; --bg2: #0b0a24; --card: rgba(27,24,69,.7); --card2: rgba(255,255,255,.04);
    --line: rgba(255,255,255,.08); --text: #eeedf8; --muted: #9a96c0; --dim: #76729c;
    --violet: #8655fb; --fuchsia: #d946ef; --cyan: #22d3ee;
    --green: #10b981; --green2: #2dd4bf; --yellow: #facc15; --yellow2: #f59e0b; --red: #f43f5e;
    --grad: linear-gradient(110deg, #7438f0, #a855f7 50%, #d946ef);
    --safe-b: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font-family: 'Plus Jakarta Sans', system-ui, sans-serif; }
  body { min-height: 100vh; overflow-x: hidden; }
  .aurora { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
  .aurora i { position: absolute; border-radius: 50%; filter: blur(70px); opacity: .55; animation: float 16s ease-in-out infinite; }
  .aurora i:nth-child(1) { width: 320px; height: 320px; background: #7c3aed; top: -120px; left: -100px; }
  .aurora i:nth-child(2) { width: 300px; height: 300px; background: #c026d3; top: 30%; right: -140px; opacity: .3; animation-direction: reverse; }
  .aurora i:nth-child(3) { width: 280px; height: 280px; background: #0891b2; bottom: -140px; left: 20%; opacity: .3; }
  @keyframes float { 50% { transform: translate(24px, -20px) scale(1.08); } }
  @keyframes up { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  @keyframes shimmer { to { background-position: -200% 0; } }
  @keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(16,185,129,.55); } 70% { box-shadow: 0 0 0 8px rgba(16,185,129,0); } }

  .app { position: relative; z-index: 1; max-width: 560px; margin: 0 auto; padding: 0 16px calc(96px + var(--safe-b)); }
  header { position: sticky; top: 0; z-index: 10; display: flex; align-items: center; gap: 10px; padding: 14px 0 12px;
    background: linear-gradient(var(--bg) 70%, transparent); }
  .brand { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; }
  .logo { width: 38px; height: 38px; border-radius: 12px; background: linear-gradient(135deg, var(--violet), var(--fuchsia) 55%, var(--cyan));
    display: grid; place-items: center; font-weight: 800; box-shadow: 0 8px 24px -8px rgba(168,85,247,.8); flex: none; }
  .brand h1 { margin: 0; font-size: 17px; font-weight: 800; letter-spacing: -.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .brand small { display: block; font-size: 10px; font-weight: 700; letter-spacing: .18em; color: #c4b5fd; }
  .back { display: none; align-items: center; gap: 6px; border: 0; cursor: pointer; font: inherit; font-weight: 800; font-size: 14px;
    color: #1c1500; padding: 10px 14px; border-radius: 14px; background: linear-gradient(135deg, var(--yellow), var(--yellow2));
    box-shadow: 0 8px 22px -8px rgba(250,204,21,.8); }
  .back.show { display: inline-flex; }
  .back:active { transform: scale(.96); }

  .hero { margin: 4px 0 16px; padding: 18px; border-radius: 22px; position: relative; overflow: hidden;
    background: linear-gradient(135deg, rgba(116,56,240,.55), rgba(217,70,239,.25) 60%, rgba(34,211,238,.25)); border: 1px solid var(--line); }
  .hero h2 { margin: 0; font-size: 22px; font-weight: 800; }
  .hero p { margin: 6px 0 0; font-size: 13px; color: #e9e3ff; opacity: .85; }
  .search { margin-top: 14px; display: flex; align-items: center; gap: 8px; background: rgba(6,5,26,.55); border: 1px solid var(--line);
    border-radius: 14px; padding: 10px 12px; }
  .search input { flex: 1; background: none; border: 0; outline: 0; color: var(--text); font: inherit; font-size: 14px; min-width: 0; }

  .chips { display: flex; gap: 8px; overflow-x: auto; padding: 2px 0 12px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { flex: none; border: 1px solid var(--line); background: var(--card2); color: var(--muted); padding: 9px 14px; border-radius: 999px;
    font: inherit; font-size: 13px; font-weight: 700; cursor: pointer; }
  .chip.on { background: var(--grad); color: #fff; border-color: transparent; box-shadow: 0 8px 22px -10px rgba(168,85,247,.9); }

  .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 20px; overflow: hidden; cursor: pointer;
    animation: up .35s both; backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
  .card:active { transform: scale(.98); }
  .thumb { aspect-ratio: 4/3; background: linear-gradient(135deg, rgba(134,85,251,.35), rgba(34,211,238,.18)); display: grid; place-items: center; font-size: 34px; }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .card .body { padding: 10px 12px 12px; }
  .card h3 { margin: 0; font-size: 13.5px; font-weight: 700; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; min-height: 35px; }
  .price { margin-top: 6px; font-weight: 800; font-size: 15px; }
  .price small { color: var(--dim); font-weight: 600; font-size: 11px; }
  .tag { display: inline-block; margin-top: 6px; font-size: 10.5px; font-weight: 800; padding: 3px 8px; border-radius: 999px; }
  .t-green { background: rgba(16,185,129,.15); color: #6ee7b7; }
  .t-red { background: rgba(244,63,94,.15); color: #fda4af; }

  .ph { display: flex; gap: 14px; align-items: center; margin-bottom: 16px; animation: up .3s both; }
  .ph .thumb { width: 84px; height: 84px; aspect-ratio: auto; border-radius: 18px; overflow: hidden; flex: none; }
  .ph h2 { margin: 0; font-size: 19px; font-weight: 800; line-height: 1.25; }
  .ph p { margin: 6px 0 0; font-size: 12.5px; color: var(--muted); }
  .section { font-size: 11px; font-weight: 800; letter-spacing: .14em; color: var(--dim); margin: 18px 0 10px; }
  .legend { display: flex; gap: 12px; font-size: 11.5px; color: var(--muted); margin: -4px 0 12px; flex-wrap: wrap; }
  .legend span::before { content: ''; display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; background: var(--c); }

  .pkg { width: 100%; display: flex; align-items: center; gap: 12px; text-align: left; font: inherit; color: var(--text);
    border: 1px solid var(--line); background: var(--card); border-radius: 18px; padding: 14px; margin-bottom: 10px; cursor: pointer; animation: up .3s both; }
  .pkg .dot { width: 12px; height: 12px; border-radius: 50%; flex: none; }
  .pkg .info { flex: 1; min-width: 0; }
  .pkg b { display: block; font-size: 14.5px; }
  .pkg em { font-style: normal; font-size: 12px; color: var(--muted); }
  .pkg .amt { font-weight: 800; font-size: 15px; white-space: nowrap; }
  .pkg.green .dot { background: var(--green); animation: pulse 2s infinite; }
  .pkg.yellow .dot { background: var(--yellow); }
  .pkg.yellow em { color: #fde68a; }
  .pkg.red { opacity: .55; cursor: not-allowed; }
  .pkg.red .dot { background: var(--red); }
  .pkg.sel { border-color: transparent; background: linear-gradient(var(--bg2), var(--bg2)) padding-box, var(--grad) border-box; border: 1.5px solid transparent; }

  .qty { display: flex; align-items: center; justify-content: space-between; gap: 12px; background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 12px; }
  .qty button { width: 52px; height: 52px; border-radius: 16px; border: 0; font-size: 24px; font-weight: 800; color: #fff; cursor: pointer; }
  .qty .minus { background: linear-gradient(135deg, #e11d48, #fb7185); }
  .qty .plus { background: linear-gradient(135deg, #059669, #2dd4bf); }
  .qty button:disabled { opacity: .35; }
  .qty .n { font-size: 30px; font-weight: 800; min-width: 60px; text-align: center; }
  .presets { display: flex; gap: 8px; margin-top: 10px; }
  .presets button { flex: 1; padding: 10px 0; border-radius: 12px; border: 1px solid var(--line); background: var(--card2); color: var(--muted); font: inherit; font-weight: 700; cursor: pointer; }
  .presets button.on { background: rgba(134,85,251,.25); color: #fff; border-color: rgba(157,125,255,.6); }

  .bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; padding: 12px 16px calc(12px + var(--safe-b));
    background: linear-gradient(transparent, var(--bg) 35%); }
  .bar .inner { max-width: 560px; margin: 0 auto; }
  .buy { width: 100%; display: flex; align-items: center; justify-content: space-between; border: 0; border-radius: 18px; padding: 16px 18px;
    font: inherit; font-weight: 800; font-size: 16px; color: #fff; cursor: pointer; background: linear-gradient(110deg, #059669, #10b981 50%, #2dd4bf);
    box-shadow: 0 14px 34px -12px rgba(16,185,129,.8); }
  .buy:disabled { filter: grayscale(.8); opacity: .6; }
  .buy:active { transform: scale(.98); }

  .tabs { display: flex; gap: 8px; background: rgba(11,10,36,.85); border: 1px solid var(--line); border-radius: 20px; padding: 6px; backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); }
  .tabs button { flex: 1; border: 0; background: none; color: var(--muted); font: inherit; font-weight: 700; font-size: 13px; padding: 11px; border-radius: 14px; cursor: pointer; }
  .tabs button.on { background: var(--grad); color: #fff; }

  .order { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 14px; margin-bottom: 10px; animation: up .3s both; }
  .order .top { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
  .order b { font-size: 14px; }
  .order .sub { font-size: 12px; color: var(--muted); margin-top: 3px; }
  .st { font-size: 11px; font-weight: 800; padding: 4px 9px; border-radius: 999px; white-space: nowrap; }
  .st.delivered { background: rgba(16,185,129,.15); color: #6ee7b7; }
  .st.paid, .st.processing { background: rgba(134,85,251,.18); color: #c4b5fd; }
  .st.stock_pending { background: rgba(250,204,21,.15); color: #fde68a; }
  .st.pending { background: rgba(255,255,255,.08); color: #dcdaf0; }
  .st.failed, .st.cancelled { background: rgba(244,63,94,.15); color: #fda4af; }
  .creds { margin-top: 10px; background: rgba(6,5,26,.7); border: 1px solid rgba(16,185,129,.25); border-radius: 12px; padding: 10px; font: 12px/1.5 ui-monospace, monospace; color: #6ee7b7; white-space: pre-wrap; word-break: break-all; max-height: 120px; overflow: auto; }
  .row { display: flex; gap: 8px; margin-top: 10px; }
  .btn { flex: 1; border: 0; border-radius: 12px; padding: 10px; font: inherit; font-weight: 700; font-size: 13px; color: #fff; cursor: pointer; background: var(--card2); border: 1px solid var(--line); }
  .btn.pay { background: linear-gradient(110deg, #059669, #2dd4bf); border: 0; }

  .skel { border-radius: 20px; background: linear-gradient(90deg, rgba(255,255,255,.04) 25%, rgba(255,255,255,.09) 50%, rgba(255,255,255,.04) 75%); background-size: 200% 100%; animation: shimmer 1.4s infinite linear; }
  .empty { text-align: center; color: var(--muted); padding: 40px 10px; font-size: 14px; }
  .empty .big { font-size: 42px; display: block; margin-bottom: 8px; }
  .toast { position: fixed; left: 50%; top: 16px; transform: translateX(-50%) translateY(-120%); z-index: 50; background: #2a1030; border: 1px solid rgba(244,63,94,.4);
    color: #fecdd3; padding: 12px 16px; border-radius: 14px; font-size: 13.5px; font-weight: 600; transition: transform .3s; max-width: calc(100% - 32px); }
  .toast.show { transform: translateX(-50%) translateY(0); }
  .toast.ok { background: #062a22; border-color: rgba(16,185,129,.4); color: #a7f3d0; }
  .success { text-align: center; padding: 30px 6px; animation: up .35s both; }
  .success .ring { width: 86px; height: 86px; margin: 0 auto 16px; border-radius: 50%; display: grid; place-items: center; font-size: 40px;
    background: linear-gradient(135deg, #059669, #2dd4bf); box-shadow: 0 0 0 10px rgba(16,185,129,.15), 0 20px 40px -12px rgba(16,185,129,.8); }
  .success h2 { margin: 0; font-size: 22px; }
  .success p { color: var(--muted); font-size: 14px; }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div class="aurora"><i></i><i></i><i></i></div>
<div class="toast" id="toast"></div>
<div class="app">
  <header>
    <button class="back" id="back">‹ Back</button>
    <div class="brand"><div class="logo">IP</div><div><h1 id="title">IPDokan Shop</h1><small>PREMIUM PROXIES</small></div></div>
  </header>
  <main id="view"></main>
</div>
<div class="bar"><div class="inner" id="bar"></div></div>

<script>
(() => {
  const tg = window.Telegram?.WebApp;
  const initData = tg?.initData || "";
  tg?.ready(); tg?.expand();
  try { tg?.setHeaderColor("#06051a"); tg?.setBackgroundColor("#06051a"); } catch (e) {}

  // ---- Phone vibration on every action ----
  const haptic = {
    tap: () => tg?.HapticFeedback?.impactOccurred("light"),
    soft: () => tg?.HapticFeedback?.impactOccurred("medium"),
    select: () => tg?.HapticFeedback?.selectionChanged(),
    ok: () => tg?.HapticFeedback?.notificationOccurred("success"),
    warn: () => tg?.HapticFeedback?.notificationOccurred("warning"),
    err: () => tg?.HapticFeedback?.notificationOccurred("error"),
  };

  const $ = (s) => document.querySelector(s);
  const view = $("#view"), bar = $("#bar"), backBtn = $("#back"), title = $("#title");
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const money = (n) => `${Number(n || 0).toLocaleString("en-US", { maximumFractionDigits: 2 })} ৳`;
  const LOW = 10;

  async function api(path, opts = {}) {
    const res = await fetch(`../shop-api${path}`, {
      ...opts,
      headers: { "Content-Type": "application/json", "X-Telegram-Init-Data": initData, ...(opts.headers || {}) },
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || "Something went wrong");
    return data;
  }

  let toastTimer;
  function toast(msg, ok = false) {
    const t = $("#toast");
    t.textContent = msg; t.className = `toast show${ok ? " ok" : ""}`;
    clearTimeout(toastTimer); toastTimer = setTimeout(() => (t.className = "toast"), 2800);
  }

  // ---- Navigation (custom yellow Back + Telegram's native back) ----
  const stack = [];
  function go(screen, push = true) {
    if (push && state.screen) stack.push(state.screen);
    state.screen = screen;
    const canBack = stack.length > 0;
    backBtn.classList.toggle("show", canBack);
    if (tg?.BackButton) canBack ? tg.BackButton.show() : tg.BackButton.hide();
    window.scrollTo({ top: 0, behavior: "instant" in window ? "instant" : "auto" });
    render();
  }
  function back() {
    haptic.tap();
    if (!stack.length) return;
    state.screen = null;
    go(stack.pop(), false);
  }
  backBtn.onclick = back;
  tg?.BackButton?.onClick(back);

  const state = { screen: null, tab: "shop", catalog: null, cat: "all", q: "", product: null, pkg: null, loc: null, qty: 1, orders: null, placed: null, busy: false };

  function tabs() {
    return `<div class="tabs">
      <button data-tab="shop" class="${state.tab === "shop" ? "on" : ""}">🛍 Shop</button>
      <button data-tab="orders" class="${state.tab === "orders" ? "on" : ""}">🧾 My Orders</button>
    </div>`;
  }
  function bindTabs() {
    bar.querySelectorAll("[data-tab]").forEach((b) => (b.onclick = () => {
      if (state.tab === b.dataset.tab) return;
      haptic.select(); state.tab = b.dataset.tab; stack.length = 0; state.screen = null;
      go(state.tab === "shop" ? "home" : "orders", false);
    }));
  }

  // ---- Screens ----
  function render() {
    ({ home: renderHome, product: renderProduct, orders: renderOrders, placed: renderPlaced }[state.screen] || renderHome)();
  }

  async function renderHome() {
    title.textContent = "IPDokan Shop";
    bar.innerHTML = tabs(); bindTabs();
    if (!state.catalog) {
      view.innerHTML = `<div class="skel" style="height:150px;margin:4px 0 16px"></div><div class="grid">${'<div class="skel" style="height:200px"></div>'.repeat(4)}</div>`;
      try { state.catalog = (await api("/catalog")).categories; }
      catch (e) { haptic.err(); view.innerHTML = `<div class="empty"><span class="big">😕</span>${esc(e.message)}<br><br><button class="btn" id="retry">🔄 Try again</button></div>`; $("#retry").onclick = () => { haptic.tap(); renderHome(); }; return; }
      if (state.screen !== "home" && state.screen) return;
    }
    const cats = state.catalog;
    const name = tg?.initDataUnsafe?.user?.first_name;
    let products = (state.cat === "all" ? cats.flatMap((c) => c.products.map((p) => ({ ...p, emoji: c.emoji }))) : (cats.find((c) => String(c.id) === state.cat)?.products || []).map((p) => ({ ...p, emoji: cats.find((c) => String(c.id) === state.cat).emoji })));
    const seen = new Set(); products = products.filter((p) => !seen.has(p.id) && seen.add(p.id));
    if (state.q) products = products.filter((p) => p.name.toLowerCase().includes(state.q.toLowerCase()));

    view.innerHTML = `
      <section class="hero">
        <h2>Hi${name ? ` ${esc(name)}` : ""} 👋</h2>
        <p>Pick a proxy. Your credentials arrive in the chat a moment after you pay.</p>
        <label class="search">🔎 <input id="q" placeholder="Search proxies…" value="${esc(state.q)}" /></label>
      </section>
      <div class="chips">
        <button class="chip ${state.cat === "all" ? "on" : ""}" data-cat="all">✨ All</button>
        ${cats.map((c) => `<button class="chip ${state.cat === String(c.id) ? "on" : ""}" data-cat="${c.id}">${esc(c.emoji)} ${esc(c.name)}</button>`).join("")}
      </div>
      ${products.length ? `<div class="grid">${products.map((p, i) => `
        <div class="card" data-id="${p.id}" style="animation-delay:${Math.min(i, 10) * 35}ms">
          <div class="thumb">${p.image ? `<img src="${esc(p.image)}" alt="" loading="lazy" />` : esc(p.emoji || "🌐")}</div>
          <div class="body"><h3>${esc(p.name)}</h3>
            <div class="price">${p.hasVariations ? "<small>from </small>" : ""}${money(p.price)}</div>
            <span class="tag ${p.inStock ? "t-green" : "t-red"}">${p.inStock ? "● In stock" : "● Sold out"}</span>
          </div>
        </div>`).join("")}</div>` : `<div class="empty"><span class="big">🔍</span>No proxies match your search.</div>`}`;

    const q = $("#q");
    q.oninput = () => { state.q = q.value; clearTimeout(q._t); q._t = setTimeout(() => { const pos = q.selectionStart; renderHome().then(() => { const n = $("#q"); n.focus(); n.setSelectionRange(pos, pos); }); }, 250); };
    view.querySelectorAll("[data-cat]").forEach((b) => (b.onclick = () => { haptic.select(); state.cat = b.dataset.cat; renderHome(); }));
    view.querySelectorAll(".card").forEach((c) => (c.onclick = () => { haptic.tap(); openProduct(c.dataset.id); }));
  }

  async function openProduct(id) {
    state.product = null; state.pkg = null; state.loc = null; state.qty = 1;
    go("product");
    try {
      state.product = await api(`/products/${id}`);
      const firstOk = state.product.packages.find((p) => p.inStock);
      if (state.product.packages.length === 1 && firstOk) state.pkg = firstOk;
      if (state.screen === "product") render();
    } catch (e) { haptic.err(); toast(e.message); back(); }
  }

  function pkgColor(p) {
    if (!p.inStock) return "red";
    if (p.stock != null && p.stock < LOW) return "yellow";
    return "green";
  }
  function maxQty() {
    const p = state.pkg; if (!p) return 1;
    let cap = state.product?.maxQuantity || 50;
    if (p.stock > 0) cap = Math.min(cap, p.stock);
    if (needsLoc() && state.loc?.stock > 0) cap = Math.min(cap, state.loc.stock);
    return cap;
  }
  // The selected package needs a location that hasn't been picked yet
  function needsLoc() { return Boolean(state.pkg?.chooseLocation && state.product?.locations?.length); }
  function ready() { return Boolean(state.pkg && (!needsLoc() || state.loc)); }
  function locColor(l) {
    if (!l.inStock) return "red";
    if (l.stock != null && l.stock < LOW) return "yellow";
    return "green";
  }

  function renderProduct() {
    const pr = state.product;
    title.textContent = pr ? pr.name : "Loading…";
    if (!pr) {
      view.innerHTML = `<div class="skel" style="height:84px;margin-bottom:16px"></div>${'<div class="skel" style="height:70px;margin-bottom:10px"></div>'.repeat(3)}`;
      bar.innerHTML = ""; return;
    }
    const p = state.pkg;
    const total = p ? p.price * state.qty : 0;
    const max = maxQty();
    view.innerHTML = `
      <div class="ph"><div class="thumb">${pr.image ? `<img src="${esc(pr.image)}" alt="" />` : "🌐"}</div>
        <div><h2>${esc(pr.name)}</h2>${pr.description ? `<p>${esc(pr.description)}</p>` : ""}</div></div>
      <div class="section">CHOOSE A PACKAGE</div>
      <div class="legend"><span style="--c:var(--green)">10+ in stock</span><span style="--c:var(--yellow)">fewer than 10</span><span style="--c:var(--red)">sold out</span></div>
      ${pr.packages.map((x, i) => { const c = pkgColor(x); return `
        <button class="pkg ${c} ${p && p.id === x.id ? "sel" : ""}" data-pkg="${i}" ${c === "red" ? "aria-disabled=true" : ""} style="animation-delay:${i * 40}ms">
          <span class="dot"></span>
          <span class="info"><b>${esc(x.name)}</b><em>${c === "red" ? "Sold out" : c === "yellow" ? `Only ${x.stock} left · hurry!` : x.stock != null ? `${x.stock} in stock` : "In stock"}</em></span>
          <span class="amt">${money(x.price)}</span>
        </button>`; }).join("")}
      ${p && needsLoc() ? `
        <div class="section">📍 CHOOSE A LOCATION</div>
        ${pr.locations.map((l, i) => { const c = locColor(l); return `
          <button class="pkg ${c} ${state.loc && state.loc.id === l.id ? "sel" : ""}" data-loc="${i}" ${c === "red" ? "aria-disabled=true" : ""} style="animation-delay:${i * 30}ms">
            <span class="dot"></span>
            <span class="info"><b>${esc(l.name)}</b><em>${c === "red" ? "Sold out" : l.stock != null ? `${l.stock} IPs available` : "Available"}</em></span>
          </button>`; }).join("")}` : ""}
      ${ready() ? `
        <div class="section">QUANTITY</div>
        <div class="qty"><button class="minus" id="minus" ${state.qty <= 1 ? "disabled" : ""}>−</button><span class="n">${state.qty}</span><button class="plus" id="plus" ${state.qty >= max ? "disabled" : ""}>+</button></div>
        <div class="presets">${[1, 5, 10, 25].filter((n) => n <= max).map((n) => `<button data-q="${n}" class="${n === state.qty ? "on" : ""}">×${n}</button>`).join("")}</div>` : ""}`;

    bar.innerHTML = `<button class="buy" id="buy" ${!ready() || state.busy ? "disabled" : ""}>
      <span>${state.busy ? "Creating order…" : ready() ? "🛒 Buy now" : p ? "Choose a location" : "Choose a package"}</span><span>${p ? money(total) : ""}</span></button>`;

    view.querySelectorAll("[data-pkg]").forEach((b) => (b.onclick = () => {
      const x = pr.packages[+b.dataset.pkg];
      if (pkgColor(x) === "red") { haptic.warn(); toast("😔 This package is sold out. Please pick another one."); return; }
      haptic.select(); state.pkg = x; state.qty = Math.min(state.qty, maxQty()); renderProduct();
    }));
    view.querySelectorAll("[data-loc]").forEach((b) => (b.onclick = () => {
      const l = pr.locations[+b.dataset.loc];
      if (locColor(l) === "red") { haptic.warn(); toast("😔 This location is sold out. Please pick another one."); return; }
      haptic.select(); state.loc = l; state.qty = Math.min(state.qty, maxQty()); renderProduct();
    }));
    const setQ = (n) => { const v = Math.max(1, Math.min(maxQty(), n)); if (v === state.qty) { haptic.warn(); return; } haptic.select(); state.qty = v; renderProduct(); };
    $("#minus") && ($("#minus").onclick = () => setQ(state.qty - 1));
    $("#plus") && ($("#plus").onclick = () => setQ(state.qty + 1));
    view.querySelectorAll("[data-q]").forEach((b) => (b.onclick = () => setQ(+b.dataset.q)));
    $("#buy").onclick = placeOrder;
  }

  async function placeOrder() {
    if (!ready() || state.busy) return;
    haptic.soft(); state.busy = true; renderProduct();
    try {
      const r = await api("/orders", { method: "POST", body: JSON.stringify({ productId: state.product.id, variationId: state.pkg.id || null, locationId: needsLoc() ? state.loc.id : null, quantity: state.qty }) });
      haptic.ok();
      state.placed = r; state.orders = null;
      go("placed");
      setTimeout(() => tg ? tg.openLink(r.paymentUrl) : (location.href = r.paymentUrl), 700);
    } catch (e) { haptic.err(); toast(e.message); }
    finally { state.busy = false; if (state.screen === "product") renderProduct(); }
  }

  function renderPlaced() {
    const r = state.placed;
    title.textContent = "Order created";
    view.innerHTML = `<div class="success"><div class="ring">✓</div><h2>Order ${esc(r.orderId)}</h2>
      <p>Total <b style="color:#fff">${money(r.total)}</b><br>Finish the payment on the secure checkout page. Your proxy will arrive in the chat right after.</p>
      <div class="row"><button class="btn pay" id="pay">💳 Pay now</button></div>
      <div class="row"><button class="btn" id="more">🛍 Keep shopping</button><button class="btn" id="mine">🧾 My orders</button></div></div>`;
    bar.innerHTML = "";
    $("#pay").onclick = () => { haptic.soft(); tg ? tg.openLink(r.paymentUrl) : (location.href = r.paymentUrl); };
    $("#more").onclick = () => { haptic.tap(); stack.length = 0; state.tab = "shop"; go("home", false); };
    $("#mine").onclick = () => { haptic.tap(); stack.length = 0; state.tab = "orders"; go("orders", false); };
  }

  const ST = { delivered: "Delivered", paid: "Paid", processing: "Paid", stock_pending: "Preparing", pending: "Awaiting payment", failed: "Failed", cancelled: "Cancelled" };
  async function renderOrders() {
    title.textContent = "My Orders";
    bar.innerHTML = tabs(); bindTabs();
    if (!state.orders) {
      view.innerHTML = '<div class="skel" style="height:96px;margin-bottom:10px"></div>'.repeat(3);
      try { state.orders = (await api("/orders")).orders; } catch (e) { haptic.err(); view.innerHTML = `<div class="empty"><span class="big">😕</span>${esc(e.message)}</div>`; return; }
      if (state.screen !== "orders") return;
    }
    if (!state.orders.length) { view.innerHTML = `<div class="empty"><span class="big">📭</span>No orders yet.<br>Your purchases will show up here.</div>`; return; }
    view.innerHTML = state.orders.map((o, i) => `
      <div class="order" style="animation-delay:${Math.min(i, 8) * 40}ms">
        <div class="top"><div><b>${esc(o.productName || "Proxy")}</b><div class="sub">${esc(o.variationName || "")}${o.quantity > 1 ? ` · ×${o.quantity}` : ""} · ${money(o.amount)}</div>
          <div class="sub">${esc(o.orderId)} · ${new Date(o.createdAt).toLocaleDateString()}${o.expiresAt ? ` · expires ${new Date(o.expiresAt).toLocaleDateString()}` : ""}</div></div>
          <span class="st ${esc(o.status)}">${ST[o.status] || esc(o.status)}</span></div>
        ${o.deliveredCredentials ? `<div class="creds">${esc(o.deliveredCredentials)}</div><div class="row"><button class="btn" data-copy="${i}">📋 Copy credentials</button></div>` : ""}
        ${o.status === "pending" && o.gatewayRedirectUrl ? `<div class="row"><button class="btn pay" data-pay="${i}">💳 Pay now</button></div>` : ""}
      </div>`).join("");
    view.querySelectorAll("[data-copy]").forEach((b) => (b.onclick = async () => {
      const text = state.orders[+b.dataset.copy].deliveredCredentials;
      try { await navigator.clipboard.writeText(text); haptic.ok(); toast("✅ Copied", true); } catch { haptic.warn(); toast("Long-press the box to copy."); }
    }));
    view.querySelectorAll("[data-pay]").forEach((b) => (b.onclick = () => { haptic.soft(); const u = state.orders[+b.dataset.pay].gatewayRedirectUrl; tg ? tg.openLink(u) : (location.href = u); }));
  }

  if (!initData) {
    view.innerHTML = `<div class="empty"><span class="big">🤖</span>Please open this shop from the IPDokan Telegram bot.</div>`;
    return;
  }
  go("home", false);
})();
</script>
</body>
</html>
